<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loading Travel Agency Operations</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #eef4f9;
            --panel: #ffffff;
            --line: #c9d8e6;
            --text: #16324a;
            --muted: #5b7488;
            --accent: #1577ab;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at top left, rgba(21, 119, 171, 0.12), transparent 40%),
                radial-gradient(circle at bottom right, rgba(30, 92, 147, 0.10), transparent 42%),
                var(--bg);
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
        }

        .shell {
            width: min(360px, calc(100vw - 32px));
            padding: 28px 26px 24px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(247,250,253,0.98));
            box-shadow: 0 20px 48px rgba(24, 58, 86, 0.12);
        }

        .badge {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(180deg, #1f84ba, #156e9d);
            display: grid;
            place-items: center;
            margin-bottom: 18px;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 24px;
            line-height: 1.15;
        }

        p {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.45;
        }

        .bar {
            overflow: hidden;
            height: 10px;
            border-radius: 999px;
            background: #e4edf5;
            border: 1px solid #d2e1ec;
        }

        .bar > span {
            display: block;
            height: 100%;
            width: 34%;
            border-radius: inherit;
            background: linear-gradient(90deg, #2d8fc2, #59b6df);
            animation: travel-load 1.25s ease-in-out infinite;
        }

        .hint {
            margin-top: 14px;
            font-size: 12px;
            color: var(--muted);
        }

        @keyframes travel-load {
            0% { transform: translateX(-110%); }
            100% { transform: translateX(320%); }
        }
    </style>
</head>
<body>
    <main class="shell" aria-live="polite">
        <div class="badge">TA</div>
        <h1>Opening workspace</h1>
        <p>Connecting to Travel Agency Operations and preparing your secure session.</p>
        <div class="bar" aria-hidden="true"><span></span></div>
        <div class="hint">Please wait a moment...</div>
    </main>
</body>
</html>
